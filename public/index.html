<!doctype html>
<!--
  The module on its own (no console): the v3 shell, cut down to what one
  module needs — the wordmark, the page, toasts and dialogs. It mounts
  /ui/index.js through the same ModuleHost the console uses, so what runs
  here is what runs there. Tailnet-only; the console owns auth.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
<meta name="color-scheme" content="light dark">
<title>Claude · ojee.console</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ojee-ui3.css">
<style>
  .sa-top{display:flex;align-items:center;gap:8px;height:calc(var(--topbar-h) + var(--safe-t));padding:var(--safe-t) calc(12px + var(--safe-r)) 0 calc(16px + var(--safe-l));border-bottom:1px solid var(--line);background:var(--page)}
  .sa-top .wm{margin-right:auto}
  .sa-shell{container:app/inline-size;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
</style>
</head>
<body>
<div class="sa-shell" id="app">
  <header class="sa-top">
    <a class="wm" href="#/agent/claude">ojee<b>.</b><span>claude</span></a>
    <button class="ib" id="theme" type="button" aria-label="Switch theme"><svg class="i" aria-hidden="true"><use href="#i-contrast"/></svg></button>
  </header>
  <main class="main" id="main"><div class="page" id="view"></div></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script type="module">
  import { ModuleHost } from './chrome.js';
  import { ensureSprite } from './ojee-ui3.js';
  await ensureSprite('icons3.svg');
  try { const t = localStorage.getItem('sa-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  document.getElementById('theme').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('sa-theme', next); } catch {}
  });
  const manifest = await (await fetch('module.json')).json();
  if (!location.hash) location.hash = '#/agent/claude';
  const host = new ModuleHost({ el: document.getElementById('view'), base: '' });
  await host.mount(manifest, 'claude', new URL('ui/index.js', location.href).href);
</script>
</body>
</html>
