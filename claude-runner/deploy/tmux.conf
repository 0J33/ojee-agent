# The tmux server that hosts ojee-claude's Claude Code sessions.
# Read by ojee-claude-tmux.service (and by the runner in dev, TMUX_MODE=self).
# Private socket: `tmux -L ojee-claude ls` to see the sessions by hand.

# Stay up with no sessions — the service owns the server's lifetime.
set -g exit-empty off
set -g history-limit 50000
# Wheel scrolls tmux's history, which is where a long session's output is.
set -g mouse on
# The console draws its own chrome; a status bar would be a second one.
set -g status off
# Keep a pane whose claude exited, so a crash can still be read. The runner
# replaces it on the next start.
set -g remain-on-exit on
set -g escape-time 10
set -g base-index 0
# A phone and a laptop may both be attached; size to whichever typed last.
set -g window-size latest
set -g aggressive-resize on
# Claude Code draws in 24-bit colour; pass it through to xterm.js.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"
set -g set-clipboard off
